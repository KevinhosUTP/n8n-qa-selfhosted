name: QA engine tests
on:
  push:
    branches: [main, develop, 'refactor/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: qa-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m compileall -q app.py packages tests scripts
      - name: Run QA regression tests
        run: python -m unittest discover -s tests -v
      - name: Install Streamlit for legacy UI test
        run: python -m pip install "streamlit>=1.40,<2"
      - name: Smoke test Streamlit start screen
        run: python scripts/smoke_streamlit.py
